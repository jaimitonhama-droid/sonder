<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08080F" />
    <meta name="description" content="Sonder – O seu app de música, vídeos e shorts em tempo real." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sonder" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sonder – Música & Entretenimento" />
    <meta property="og:description" content="O seu app de música, vídeos e shorts em tempo real." />

    <title>Sonder</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/icon.png" />
    <link rel="shortcut icon" href="/assets/favicon.png" />

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        background: #08080F;
        overscroll-behavior: none;
      }

      #root { height: 100%; }

      /* ── Splash Screen ── */
      #splash {
        position: fixed;
        inset: 0;
        background: #08080F;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }

      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* Logo sem animação */
      #splash img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        border-radius: 24px;
      }

      /* Texto igual ao header do app */
      #splash .brand {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      #splash .brand .s    { color: #ffffff; }
      #splash .brand .onder { color: #E8192C; }

      /* Spinner simples */
      #splash .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255,255,255,0.12);
        border-top-color: #E8192C;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <!-- Splash Screen -->
    <div id="splash">
      <img src="/assets/icon.png" alt="Sonder" />
      <div class="brand">
        <span class="s">S</span><span class="onder">onder</span>
      </div>
      <div class="spinner"></div>
    </div>

    <div id="root"></div>

    <script>
      window.__hideSplash = function () {
        var s = document.getElementById('splash');
        if (s) {
          s.classList.add('hidden');
          setTimeout(function () { s.remove(); }, 500);
        }
      };
      // Fallback: esconde após 4s mesmo que o React não avise
      setTimeout(window.__hideSplash, 4000);
    </script>

    <!-- Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js')
            .then(function (reg) {
              console.log('[Sonder PWA] SW registado:', reg.scope);
            })
            .catch(function (err) {
              console.warn('[Sonder PWA] SW erro:', err);
            });
        });
      }
    </script>
  </body>
</html>
