    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: #08080F; overscroll-behavior: none; }
      #root { height: 100%; }
      #splash {
        position: fixed; inset: 0; background: #08080F;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 24px;
        z-index: 9999; transition: opacity 0.4s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash img { width: 120px; height: 120px; object-fit: contain; border-radius: 24px; }
      #splash .brand {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 22px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase;
      }
      #splash .brand .s    { color: #ffffff; }
      #splash .brand .onder { color: #E8192C; }
      #splash .spinner {
        width: 32px; height: 32px;
        border: 3px solid rgba(255,255,255,0.12);
        border-top-color: #E8192C;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
