<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E8192C" />
    <meta name="description" content="Sonder – O seu app de música, vídeos e shorts em tempo real." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sonder" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sonder – Música & Entretenimento" />
    <meta property="og:description" content="O seu app de música, vídeos e shorts em tempo real." />

    <title>Sonder</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/assets/icon.png" />
    <link rel="shortcut icon" href="/assets/favicon.png" />

    <style>
      * { box-sizing: border-box; }
      html, body, #root { margin: 0; padding: 0; height: 100%; background: #000; }
      body { overscroll-behavior: none; }
    </style>
  </head>
  <body>
    <noscript>Precisa de activar o JavaScript para usar o Sonder.</noscript>

    <!-- Registo do Service Worker PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js')
            .then(function (reg) {
              console.log('[Sonder PWA] Service Worker registado:', reg.scope);
            })
            .catch(function (err) {
              console.warn('[Sonder PWA] Erro ao registar SW:', err);
            });
        });
      }
    </script>
  </body>
</html>
